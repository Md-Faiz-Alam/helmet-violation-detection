annotation:
  method: 'tracker boxes from a high-recall run (1280 px input, low tracker thresholds) as starting keyframes, plus COCO person-on-two-wheeler
    proposals for riders the tracker missed; every entry checked by eye on enlarged 1080p crops; split tracks merged where
    keyframe positions continue each other in time (R74/R133/R185, R193/R154/A3, R49/R169 and others), a walking pedestrian
    and a proposal box on a road sign removed. Uncertain: the two women at 9 s (R15/R16 here) may be the pink-dressed pillion
    and companion seen at 3-5 s overtaking again; kept as separate riders. The scooter driver in front of R1 is never visible
    (head hidden) and is not labelled; the child in front of R18 is under 24 px and not labelled; owner review: R9 was merged
    with 3 frames of a different, helmeted scooter rider (a COCO proposal that jumped between riders): those frames split
    off as R19'
  annotated_by: Md Faiz Alam (keyframes drafted with scripts/video_gt_draft.py from a high-recall tracker run, plus COCO rider
    proposals for riders the tracker missed; corrected by hand)
  reviewed_by: 'Md Faiz Alam (project owner), 2026-11-22: all labels confirmed except R9, where one crop showed another rider
    (fixed, see method)'
  rules: 'rider = person on a two-wheeler (driver or pillion); bicycle riders are labelled with vehicle: bicycle and need
    no helmet (never violators); helmet true/false/''unclear''; plate only if a person can read it; keyframes = head boxes
    [x1, y1, x2, y2] in pixels of this resolution, keyed by 1-based frame number; riders whose head is never >= 24 px tall
    are ignored by eval_video.py'
