annotation:
  method: 'tracker boxes from a high-recall run (1280 px input, low tracker thresholds) as starting keyframes, plus COCO person-on-two-wheeler
    proposals for riders the tracker missed; every entry checked by eye on the overview frames and crops: 4 tracks of the
    striped-shirt rider merged, 1 duplicate box on a helmeted rider''s face removed, 1 stall keeper and 6 standing people
    proposed by COCO removed; the child pillion got 2 hand-drawn keyframes (61, 91) where the model detects nothing'
  annotated_by: Md Faiz Alam (keyframes drafted with scripts/video_gt_draft.py from a high-recall tracker run, plus COCO rider
    proposals for riders the tracker missed; corrected by hand)
  reviewed_by: 'Md Faiz Alam (project owner), 2026-11-22: all labels confirmed; the cyclist marked vehicle: bicycle (no helmet
    rule for bicycles)'
  rules: 'rider = person on a two-wheeler (driver or pillion); bicycle riders are labelled with vehicle: bicycle and need
    no helmet (never violators); helmet true/false/''unclear''; plate only if a person can read it; keyframes = head boxes
    [x1, y1, x2, y2] in pixels of this resolution, keyed by 1-based frame number; riders whose head is never >= 24 px tall
    are ignored by eval_video.py'
