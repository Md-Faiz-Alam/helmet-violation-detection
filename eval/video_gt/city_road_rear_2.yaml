annotation:
  method: 'tracker boxes from a high-recall run (1280 px input, low tracker thresholds) as starting keyframes, plus COCO person-on-two-wheeler
    proposals for riders the tracker missed; identities checked by eye on frames with every draft box drawn: the tracker swapped
    IDs between the white-shirt man and the person in yellow on the near bike (5 and 4 tracks merged), the ''MUBIN 5'' jersey
    rider (4 tracks), the denim-jacket rider (2) and the far cream-uniform rider (5) merged; 3 ghost or sub-24 px entries
    and 1 proposal that drifts between people removed'
  annotated_by: Md Faiz Alam (keyframes drafted with scripts/video_gt_draft.py from a high-recall tracker run, plus COCO rider
    proposals for riders the tracker missed; corrected by hand)
  reviewed_by: 'Md Faiz Alam (project owner), 2026-11-22: all labels confirmed'
  rules: 'rider = person on a two-wheeler (driver or pillion); bicycle riders are labelled with vehicle: bicycle and need
    no helmet (never violators); helmet true/false/''unclear''; plate only if a person can read it; keyframes = head boxes
    [x1, y1, x2, y2] in pixels of this resolution, keyed by 1-based frame number; riders whose head is never >= 24 px tall
    are ignored by eval_video.py'
  corrections: '2026-11-23, found while checking false logs: R2 got keyframes 125, 141 and 157 (read off a pixel grid) so a track in that gap can be matched; the existing boxes were checked and kept; reviewed by Md Faiz Alam (project owner), 2026-11-23: confirmed, none of these riders wears a helmet'
