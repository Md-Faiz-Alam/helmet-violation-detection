annotation:
  method: 'crowded market street, chosen to tune a ''who is riding'' check: tracker boxes from a high-recall run (1280 px
    input, low tracker thresholds) plus COCO person-on-two-wheeler proposals; every entry checked by eye on enlarged crops.
    Pedestrians (walking, at stalls, loading goods) and cycle-rickshaw pullers and passengers (three wheels, not two-wheeler
    riders) are deliberately not riders: a violation logged on them counts as a false log. 2 people with a bicycle whose riding
    could not be told from the crops (draft R12, R121/R210) are left out. The pillion in the pink headscarf got 3 hand-drawn
    keyframes (the drafts boxed flags above her head); owner review: the woman in a headscarf at the right edge (draft R34/A1)
    stands beside the red scooter, not on it: removed'
  annotated_by: Md Faiz Alam (keyframes drafted with scripts/video_gt_draft.py from a high-recall tracker run, plus COCO rider
    proposals for riders the tracker missed; corrected by hand)
  reviewed_by: 'Md Faiz Alam (project owner), 2026-11-22: all labels confirmed except the woman beside the red scooter, who
    is not riding (removed)'
  rules: 'rider = person on a two-wheeler (driver or pillion); bicycle riders are labelled with vehicle: bicycle and need
    no helmet (never violators); helmet true/false/''unclear''; plate only if a person can read it; keyframes = head boxes
    [x1, y1, x2, y2] in pixels of this resolution, keyed by 1-based frame number; riders whose head is never >= 24 px tall
    are ignored by eval_video.py'
