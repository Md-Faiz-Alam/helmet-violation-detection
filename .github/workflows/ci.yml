# Lint + unit tests on every push/PR (fast, no model), then type checking and end-to-end smoke tests
# with the real model on CPU (both need the full dependencies).
#
# Deploys (only after every test job passes, and only what changed):
#   backend/, models/, configs/ changed on main -> image pushed to ghcr.io -> Azure Container Apps updated
#   frontend/ changed on main                   -> web app built and deployed to Azure Static Web Apps
#   frontend/ changed in a pull request         -> preview copy of the web app (closed by preview-close.yml)
#   manual run (Actions > CI > Run workflow)    -> deploys both
# Azure sign-in is OIDC (no stored password). Deploy jobs are skipped until deploy/azure_setup.sh has been run
# and the repository variables it prints are set.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never stop a deploy halfway

env:
  AZURE_RESOURCE_GROUP: ridesafe-rg
  AZURE_CONTAINER_APP: ridesafe-api
  AZURE_STATIC_WEB_APP: ridesafe-web

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none  # file names only: skip downloading old file contents
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;  # manual run: everything
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" "$GITHUB_SHA")
          echo "$files"
          grep -qE '^(backend/|models/|configs/|scripts/export_onnx\.py$)' <<<"$files" && api=true || api=false
          grep -qE '^frontend/' <<<"$files" && web=true || web=false
          echo "api=$api" | tee -a "$GITHUB_OUTPUT"; echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The unit tests cover the runtime package (tracking votes, ByteTrack, plates, association, ONNX
      # pre/post-processing, the API with a fake detector) and video scoring, so they need no model or PyTorch.
      - run: >-
          pip install ruff==0.17.6 pytest==9.2.0 pyyaml==6.0.3 numpy==2.5.5 pillow==13.0.0
          opencv-python-headless==5.1.0.95 onnxruntime==1.32.0 lap==0.5.14
          fastapi==0.165.0 python-multipart==0.0.34 httpx==0.28.1
      - run: pip install --no-deps -e backend
      - run: ruff check .
      - run: pytest

  smoke:
    name: Type check + smoke tests (real model, CPU)
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      # CPU-only PyTorch first: a plain `pip install ultralytics` on Linux pulls the multi-GB CUDA build
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Type check (Pyright, settings in pyrightconfig.json)
        run: pyright
      # The video pipeline and the API run on ONNX Runtime: export the models first
      - run: python scripts/export_onnx.py --vehicles
      - run: pytest -m smoke -v

  docker:
    name: Docker image (build + container smoke test)
    needs: [lint-and-unit, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push to ghcr.io (main only)
    steps:
      - uses: actions/checkout@v7
      # Stage 1 exports the models with PyTorch; the final image must not contain it
      - run: >-
          docker build -f backend/Dockerfile -t ridesafe-api:ci
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }} .
      - name: Image size, no PyTorch inside
        run: |
          docker image ls ridesafe-api:ci --format 'Image size: {{.Size}}'
          if docker run --rm ridesafe-api:ci python -c "import torch"; then echo "PyTorch found in the image"; exit 1; fi
      - name: Start the container and call the API
        run: |
          docker run -d --name api -p 8000:8000 -e RIDESAFE_DEMO=true ridesafe-api:ci
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/model
          curl -fs -F "file=@samples/image1.jpg;type=image/jpeg" localhost:8000/detect | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['without_helmet'] >= 1, d; print(d)"
      - name: Container logs
        if: failure()
        run: docker logs api
      # Published for the deploy job; it is only deployed after every test job has passed
      - name: Push to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.api == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ridesafe-api"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "sha-$GITHUB_SHA" latest; do
            docker tag ridesafe-api:ci "$image:$tag" && docker push "$image:$tag"
          done

  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-api:
    name: Deploy API (Azure Container Apps)
    needs: [changes, lint-and-unit, smoke, docker, web]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.outputs.api == 'true' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to Azure
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" -o none \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}/ridesafe-api:sha-$GITHUB_SHA"
      - name: Check the live API
        env:
          API_URL: ${{ vars.RIDESAFE_API_URL }}
        run: |
          image=$(az containerapp show -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
                  --query "properties.template.containers[0].image" -o tsv)
          echo "Configured image: $image"; [[ "$image" == *":sha-$GITHUB_SHA" ]]
          # Scaled to zero: the first request starts a replica (image pull + model load)
          for i in $(seq 1 30); do curl -fsS --max-time 20 "$API_URL/health" && break; sleep 10; done
          curl -fsS "$API_URL/model" | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['demo'], d; print('demo mode on')"

  deploy-web:
    name: Deploy web app (Azure Static Web Apps)
    needs: [changes, lint-and-unit, smoke, docker, web]
    # main, or a preview for pull requests from this repository (forks get no Azure sign-in)
    if: >-
      needs.changes.outputs.web == 'true' && vars.AZURE_CLIENT_ID != '' && (
        (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # OIDC sign-in to Azure
      pull-requests: write  # the preview link is posted on the pull request
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.RIDESAFE_API_URL }}
        run: npm ci --no-audit --no-fund && npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The site's deployment key is read with the OIDC sign-in for this run only, never stored in GitHub
      - id: key
        run: |
          key=$(az staticwebapp secrets list -n "$AZURE_STATIC_WEB_APP" -g "$AZURE_RESOURCE_GROUP" \
                --query properties.apiKey -o tsv)
          echo "::add-mask::$key"
          echo "value=$key" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.key.outputs.value }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
