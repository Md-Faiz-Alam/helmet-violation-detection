# Lint + unit tests on every push/PR (fast, no model), then type checking and end-to-end smoke tests
# with the real model on CPU (both need the full dependencies).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The unit tests cover pure-Python logic (tracking votes, plates, association, video scoring),
      # so they need no model or PyTorch.
      - run: pip install ruff==0.17.6 pytest==9.2.0 pyyaml==6.0.3
      - run: ruff check .
      - run: pytest

  smoke:
    name: Type check + smoke tests (real model, CPU)
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      # CPU-only PyTorch first: a plain `pip install ultralytics` on Linux pulls the multi-GB CUDA build
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Type check (Pyright, settings in pyrightconfig.json)
        run: pyright
      - run: pytest -m smoke -v
