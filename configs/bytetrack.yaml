# ByteTrack settings for the video pipeline (backend/ridesafe/bytetrack.py; same format as Ultralytics trackers).
# Lower than the Ultralytics defaults so that weak detections still start and keep tracks; the tuned
# per-class thresholds (configs/thresholds.yaml) are applied afterwards, when a track's frames vote.
# (Set when the "Without Helmet" threshold was 0.16; kept as is: the video benchmark was measured with it.)
tracker_type: bytetrack
track_high_thresh: 0.16 # first-stage matching (default 0.25)
track_low_thresh: 0.1   # second-stage matching keeps weak detections attached to existing tracks
new_track_thresh: 0.2   # start a new track (default 0.25)
track_buffer: 30        # frames a lost track is kept (about 1 s at 30 FPS) before its ID is dropped
match_thresh: 0.8
fuse_score: true
