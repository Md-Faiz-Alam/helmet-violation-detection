server {
    listen 80;
    root /usr/share/nginx/html;

    # The API (docker-compose service "api"); uploads stream straight through
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed build assets never change: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/analyze, /review, ...) all load index.html
    location / {
        add_header Cache-Control "no-cache";
        # Same policy as the Azure site (frontend/vite.config.ts); here the API is on the same origin (/api)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri /index.html;
    }
}
